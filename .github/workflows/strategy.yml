name: Random Strategy

# Monday morning: draw the week's pick before the open (it fills at the close).
# Every weekday evening: refresh prices, dividends and the ledger after the close.
on:
  schedule:
    - cron: '0 13 * * 1'      # Mon 9:00 ET (8:00 in winter)
    - cron: '30 21 * * 1-5'   # Mon-Fri 5:30 PM ET (4:30 PM in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: random-strategy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rule tests
        run: python -m unittest strategy/test_engine.py
      - name: Pick and rebuild ledger
        run: python strategy/engine.py
      - name: Commit
        run: |
          git config user.name "random-strategy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy/picks.json strategy/portfolio.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Random Strategy update $(date -u +%Y-%m-%d)"
          git push
